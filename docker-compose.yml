services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: opportunities
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/opportunities
      JWT_SECRET: change-me-for-production
      EMBEDDING_PROVIDER: fastembed
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - embedding_cache:/root/.cache
volumes:
  pgdata:
  embedding_cache:
